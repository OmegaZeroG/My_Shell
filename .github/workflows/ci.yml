name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build (warnings-as-errors)
        run: make

      - name: Run regression suite
        run: bash tests/test.sh

      - name: Rebuild with AddressSanitizer / LeakSanitizer / UBSan
        run: |
          make fclean
          gcc -Wall -Wextra -Wshadow -Werror -g \
              -fsanitize=address,leak,undefined \
              -o my_shell main.c input_parser.c helpers.c builtins.c \
              executor.c history.c signals.c jobs.c

      - name: Run regression suite under the sanitizers
        run: bash tests/test.sh

      - name: Rebuild a clean release binary
        run: |
          make fclean
          make
